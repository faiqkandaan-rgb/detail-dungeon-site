<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<style>html,body{margin:0;background:#0b0b0e}#st{width:900px;height:900px;position:relative;background:radial-gradient(120% 72% at 50% 94%,#3A3B45 0%,#1F2026 40%,#0D0D11 100%)}canvas{display:block;width:100%;height:100%}
#cap{position:absolute;left:16px;bottom:14px;color:#fff;font:600 18px/1.2 system-ui;text-shadow:0 1px 4px #000}</style>
</head><body><div id="st"><canvas id="c"></canvas><div id="cap"></div></div>
<script type="module">
import { initCoverage } from './3d/coverage.js';
const q = new URLSearchParams(location.search);
window.__api = initCoverage({ canvas:document.getElementById('c'), stage:document.getElementById('st'), pixelRatio:+(q.get('dpr')||1), quality:q.get('mode')||'capture',
  onShot:s=>{ document.getElementById('cap').textContent = s.label; },
  onReady:(api)=>{ api.play(q.get('pkg')||'basic'); api.stop(); window.__ready = true; },
  onFail:e=>{ console.log('COVFAIL', e && (e.message||e)); window.__ready='err'; } });
window.__trim = { seek:t=>window.__api.seek(t) };
</script></body></html>
