# Deploys this folder to Netlify on every push to main.
# Needs one repo secret: NETLIFY_AUTH_TOKEN (Netlify > User settings > Applications > Personal access tokens).
# Optional: NETLIFY_SITE_ID to deploy into an existing site; otherwise a site is created on first run.
name: Deploy to Netlify
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the site
        run: zip -qr /tmp/site.zip . -x '.git/*' '.github/*'
      - name: Create or reuse the site, deploy the zip
        env: { TOKEN: "${{ secrets.NETLIFY_AUTH_TOKEN }}", SITE: "${{ secrets.NETLIFY_SITE_ID }}" }
        run: |
          set -e
          if [ -z "$SITE" ]; then
            SITE=$(curl -sS -X POST https://api.netlify.com/api/v1/sites -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"name":"detail-dungeon-concept"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
            echo "created site $SITE"
          fi
          curl -sS -X POST "https://api.netlify.com/api/v1/sites/$SITE/deploys" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/zip" --data-binary @/tmp/site.zip \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("deploy", d.get("id"), d.get("state")); print("URL:", d.get("ssl_url") or d.get("url"))'
          curl -sS "https://api.netlify.com/api/v1/sites/$SITE" -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("Site URL:", d.get("ssl_url"))'
