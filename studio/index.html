:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,10,13,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:30px;height:auto;flex:none}
.brand b{font-family:var(--f-label);font-weight:700;letter-spacing:.16em;font-size:12px;white-space:nowrap}
.brand span{color:var(--mute);font-size:13px;white-space:nowrap}
.sp{flex:1}
.chip-ex{font-family:var(--f-label);font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--warn);border:1px solid rgba(227,164,51,.35);background:var(--warn-soft);padding:5px 9px;border-radius:999px;white-space:nowrap}
.ibtn{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;color:var(--fg);padding:0}

#menuBtn{position:relative;margin-left:-8px}

html:has(dialog[open]){overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--fg);min-height:40px}
.btn:hover{border-color:var(--silver)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{filter:brightness(1.1)}
.btn.wa{border-color:rgba(37,211,102,.45);color:#fff;background:rgba(37,211,102,.14)}
.btn.wa .ic{color:var(--wa)}
.btn.danger{color:#FF6A70;border-color:rgba(225,20,28,.4);background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{width:18px;height:18px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px 12px;color:var(--mute);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--red)}
.tab .ct{font-family:var(--f-num);color:var(--dim);margin-left:6px}

/* menu drawer */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:61;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--panel);border-right:1px solid var(--line2);transform:translateX(-102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow-y:auto;overscroll-behavior:contain;visibility:hidden}
.drawer.on{transform:none;visibility:visible}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.dsec{font-family:var(--f-label);font-weight:600;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);padding:14px 10px 6px}
.dnav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--fg);text-align:left;padding:11px 10px;border-radius:10px;font-weight:600;font-size:15px}
.dnav:hover{background:var(--panel2)}

.dnav .ic{color:var(--mute)}

main{padding-block:22px 80px}

.banner{border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:12px 14px;color:var(--mute);margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{min-width:8px}
.period{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.period button{border:0;background:none;padding:7px 12px;color:var(--mute);font-weight:600;font-size:12.5px}
.period button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}

/* summary strip */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-block:14px 22px}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}

/* bay */
.bay{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}

.st-Booked{color:var(--blue);background:var(--blue-soft)}

.st-New{color:var(--red);background:var(--red-soft)}
.st-Contacted{color:var(--warn);background:var(--warn-soft)}

.st-Due{color:var(--warn);background:var(--warn-soft)}
.st-Paid{color:var(--ok);background:var(--ok-soft)}
.st-Follow{color:var(--blue);background:var(--blue-soft)}
.src{font-size:11.5px;color:var(--silver);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.mini{border:1px solid var(--line2);background:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--fg);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}

.empty{color:var(--dim);padding:18px;border:1px dashed var(--line2);border-radius:12px;text-align:center}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}

/* bars */
.bars{display:grid;gap:10px}
.br{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto;gap:10px;align-items:center}
.br .k{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.br .t i.red{background:var(--red)}
.br .v{font-family:var(--f-num);font-size:15px;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}

/* weekly columns */
.wk svg{width:100%;height:auto;display:block}

/* lists */
.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.li[data-open]{cursor:pointer}

.li .main span.tag{display:inline-block;font-size:11px;color:var(--blue);vertical-align:1px}
.when{font-family:var(--f-num);color:var(--dim);font-size:13px;white-space:nowrap}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--f-label);font-weight:600;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr[data-open]{cursor:pointer}
tbody tr:hover td{background:var(--panel2)}
td.r,th.r{text-align:right}
.prod{display:inline-block;font-size:11.5px;color:var(--mute);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;margin:2px 4px 2px 0;white-space:nowrap}
select.stsel{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:5px 8px;font-size:12.5px;font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line2);background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--mute);white-space:nowrap}

.search{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;min-width:0;width:240px;max-width:100%}

/* stock */
.stk>.pill{justify-self:end}
.stk{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,2fr) 104px 88px auto;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.stk:last-child{border-bottom:0}

.stk .gauge u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn);text-decoration:none}
.stk.low .gauge i{background:var(--warn)}

@media(max-width:640px){.stk{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm left" "gauge gauge" "pill acts";row-gap:10px}
  .stk .nm{grid-area:nm}.stk .left{grid-area:left}.stk .gauge{grid-area:gauge}.stk>.pill{grid-area:pill;justify-self:start}.stk .acts{grid-area:acts}}

/* dialogs */
dialog{border:1px solid var(--line2);background:var(--panel);color:var(--fg);border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}

.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.fsec:first-child{border-top:0;padding-top:0;margin-top:0}

label.f{display:grid;gap:6px;align-content:start;font-size:12.5px;color:var(--mute);font-weight:600;min-width:0}

.plines{display:grid;gap:8px}
.pline{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;align-items:center}
.pline select,.pline input{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
.x{border:1px solid var(--line2);background:none;border-radius:8px;width:34px;height:34px;color:var(--mute)}
.dact{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:16px 0 20px;background:linear-gradient(rgba(18,18,23,0),var(--panel) 30%);margin-top:8px}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}

.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}

.dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 14px}

.hist{display:grid;gap:6px;margin-bottom:14px}

.sfoot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 0 20px;background:linear-gradient(rgba(18,18,23,0),var(--panel) 30%)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--fg);color:var(--bg);padding:8px 8px 8px 16px;border-radius:12px;font-weight:600;transition:.25s;pointer-events:none;z-index:80;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);min-height:40px}

/* phones: the menu replaces the tab row; tables become stacked cards; forms are full screen */

function normPhone(p){
  let s = String(p || "").replace(/\D/g, ""); if(!s) return "";

  if(s.startsWith("92") && s.length >= 12) return s;
  if(s.startsWith("0") && s.length === 11) return "92" + s.slice(1);

  S.jobs.forEach(j => { const k = custKey(j); if(!k) return;
    const c = m.get(k) || { key:k, name:"", phone:"", cars:new Map(), jobs:[], spent:0, paid:0, last:"", warranty:"" };
    if(j.customer && !c.name) c.name = j.customer; if(j.phone && !c.phone) c.phone = j.phone;
    const ck = (j.car || "") + (j.plate ? " · " + j.plate : ""); if(ck) c.cars.set(ck, 1);
    c.jobs.push(j); c.spent += +j.price || 0; c.paid += Math.min(+j.paid || 0, +j.price || 0);
    if((j.dateIn || "") > c.last) c.last = j.dateIn || "";
    const w = warrantyTo(j); if(w && w > c.warranty) c.warranty = w;
    m.set(k, c); });
  return [...m.values()].map(c => ({ ...c, cars:[...c.cars.keys()], due: c.spent - c.paid })).sort((a, b) => cmp(b.last, a.last));
}

function bars(rows, opts){
  opts = opts || {};
  const max = Math.max(1, ...rows.map(r => r[1]));
  if(!rows.length) return '<div class="empty">Nothing in this period yet.</div>';
  return '<div class="bars">' + rows.map((r, i) =>
    `<div class="br"><span class="k" title="${esc(r[0])}">${esc(r[0])}</span><span class="t"><i class="${i === 0 && opts.lead ? "red" : ""}" style="width:${(r[1]/max*100).toFixed(1)}%"></i></span><span class="v">${opts.fmt ? opts.fmt(r[1]) : fmt(r[1])}</span></div>`).join("") + '</div>';
}
function weekly(){
  const W = 8, now = new Date(todayISO() + "T12:00:00");
  const day = (now.getDay() + 6) % 7, monday = new Date(now - day*864e5);
  const weeks = [...Array(W)].map((_, i) => ({ start: new Date(monday - (W-1-i)*7*864e5), n: 0 }));
  S.jobs.forEach(j => { if(!j.dateIn) return; const d = new Date(j.dateIn + "T12:00:00");
    weeks.forEach(w => { if(d >= w.start && d < new Date(+w.start + 7*864e5)) w.n++; }); });
  const max = Math.max(1, ...weeks.map(w => w.n)), H = 120, bw = 34, gap = 18, padL = 8, top = 18;
  const width = padL*2 + W*bw + (W-1)*gap;
  let g = "";
  weeks.forEach((w, i) => {
    const x = padL + i*(bw+gap), h = Math.round(w.n / max * (H - top)), y = H - h, cur = i === W-1;
    g += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h, 2)}" rx="4" fill="${cur ? "var(--red)" : "var(--silver)"}" opacity="${cur ? 1 : .8}"></rect>`;
    g += `<text class="val" x="${x + bw/2}" y="${y - 6}" text-anchor="middle">${w.n}</text>`;
    g += `<text x="${x + bw/2}" y="${H + 16}" text-anchor="middle">${w.start.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</text>`;
  });
  return `<div class="wk"><svg viewBox="0 0 ${width} ${H + 24}" role="img" aria-label="Jobs started per week, last 8 weeks"><line x1="0" x2="${width}" y1="${H}" y2="${H}" stroke="var(--line2)"></line>${g}</svg></div>`;
}

}

function render(){
  const ready = S.got.jobs && S.got.leads && S.got.stock;
  const nNew = S.leads.filter(l => l.status === "New").length;
  $("#ctJobs").textContent = S.jobs.length || "";
  $("#ctLeads").textContent = nNew || "";
  $("#ctCust").textContent = ready ? (customers().length || "") : "";
  const u = used(); const low = S.stock.filter(s => stockState(s, u).state !== "ok").length;
  $("#ctStock").textContent = low ? low + " low" : "";
  $("#exChip").hidden = !(S.jobs.some(j => j.example) || S.leads.some(l => l.example));
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === S.tab)));
  $("#btnJob").disabled = $("#btnLead").disabled = !S.canWrite || !S.db;
  $("#menuBtn").classList.toggle("dot", nNew > 0);
  renderDrawer();
  const m = $("#main");
  if(!S.db){ m.innerHTML = `<div class="empty">${S.dbChecked ? "The studio data isn't connected in this view." : "Loading the studio desk. Jobs, leads and stock appear here once the data connects."}</div>`; return; }
  if(!ready){ m.innerHTML = '<div class="empty">Loading jobs, leads and stock…</div>'; return; }
  const act = document.activeElement, keep = act && ["jq","lq","cq"].includes(act.id) ? act.id : "";
  const title = `<h1 class="ptitle">${TABS[S.tab]}${$("#exChip").hidden ? "" : '<span class="chip-ex">Example data</span>'}</h1>`;
  m.innerHTML = title + (S.tab === "jobs" ? renderJobs() : S.tab === "leads" ? renderLeads() : S.tab === "customers" ? renderCustomers() : S.tab === "stock" ? renderStock() : renderOverview());
  tabbable(m);
  if(keep){ const q = document.getElementById(keep); if(q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  if(S.sheet && $("#sheet").open) refreshSheet();
}

function tabbable(root){ root.querySelectorAll("[data-open]:not(button)").forEach(el => { el.tabIndex = 0; if(el.tagName !== "TR") el.setAttribute("role", "button"); }); }
/* ---- menu ------------------------------------------------------------------ */
function menu(open){
  const d = $("#drawer"), s = $("#scrim");
  d.classList.toggle("on", open); s.classList.toggle("on", open);
  d.setAttribute("aria-hidden", String(!open)); $("#menuBtn").setAttribute("aria-expanded", String(open));
  document.documentElement.classList.toggle("lock", open);
  if(open){ const f = d.querySelector('.dnav[aria-current="page"]') || d.querySelector(".dnav"); if(f) setTimeout(() => f.focus({preventScroll:true}), 60); }
  else if(document.activeElement && d.contains(document.activeElement)) $("#menuBtn").focus({preventScroll:true});
}

/* ---- detail sheets --------------------------------------------------------- */
const sheet = $("#sheet"), sheetBody = $("#sheetBody");
let stack = [];
function openSheet(kind, id, opts){
  opts = opts || {};
  if(sheet.open && S.sheet && !opts.back && !(S.sheet.kind === kind && S.sheet.id === id)) stack.push(S.sheet);
  if(!sheet.open && !opts.keep) stack = [];
  S.sheet = { kind, id }; sheetBody.innerHTML = ""; refreshSheet(); modal(sheet); sheetBody.scrollTop = 0;
}
function closeSheet(){ stack = []; S.sheet = null; if(sheet.open) sheet.close(); }
sheet.addEventListener("close", () => { S.sheet = null; if(!holdStack) stack = []; });
let holdStack = false;
function refreshSheet(){
  const s = S.sheet; if(!s) return;
  let html = "";
  if(s.kind === "job") html = jobSheet(s.id);
  else if(s.kind === "lead") html = leadSheet(s.id);
  else if(s.kind === "cust") html = custSheet(s.id);
  else if(s.kind === "search"){ if(!sheetBody.querySelector("#gq")) sheetBody.innerHTML = searchSheet(); searchResults(); return; }
  if(html === null){ closeSheet(); return; }
  /* keep anything typed but not saved yet across live refreshes */
  const kept = [...sheetBody.querySelectorAll("[data-keep]")].filter(el => el.dataset.dirty === "1").map(el => [el.id, el.value]);
  const foc = document.activeElement && sheetBody.contains(document.activeElement) ? document.activeElement.id : "";
  const top = sheetBody.scrollTop; sheetBody.innerHTML = html; sheetBody.scrollTop = top;
  tabbable(sheetBody);
  kept.forEach(([id, v]) => { const el = document.getElementById(id); if(el){ el.value = v; el.dataset.dirty = "1"; } });
  if(foc){ const el = document.getElementById(foc); if(el) el.focus({preventScroll:true}); }
}
const closeBtn = () => `<div class="row" style="flex-wrap:nowrap;gap:4px">${stack.length ? `<button class="ibtn ghost" type="button" data-act="sheet-back" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>` : ""}<button class="ibtn ghost" type="button" data-act="sheet-close" aria-label="Close">${icon("close")}</button></div>`;
function msgFor(j, kind){
  const hi = "Hi" + (first(j.customer) ? " " + first(j.customer) : "") + ", this is Detail Dungeon.";
  const bal = balance(j), w = warrantyTo(j);
  if(kind === "booked") return `${hi} Your ${j.car} is booked in for ${svc(j)}${j.film ? " (" + j.film + ")" : ""} on ${longDate(j.dateIn)}.${+j.price ? " Price: " + rs(j.price) + "." : ""}${+j.paid ? " Advance received: " + rs(j.paid) + "." : ""} See you then.`;
  if(kind === "ready") return `${hi} Your ${j.car} is ready for pickup.${bal ? " Balance due: " + rs(bal) + "." : " It's fully paid."}${w ? " Your " + j.film + " warranty runs until " + longDate(w) + "." : ""} Thank you.`;
  if(kind === "thanks") return `${hi} Thank you for bringing your ${j.car} to us.${w ? " Your " + j.film + " warranty runs until " + longDate(w) + ". Keep this message for your records." : ""} Any questions, just message us here.`;
  if(kind === "receipt") return `${hi} Payment received for your ${j.car} (${svc(j)}). Total ${rs(j.price)}, paid ${rs(Math.min(+j.paid || 0, +j.price || 0))}${bal ? ", balance " + rs(bal) : ", fully paid"}. Thank you.`;
  return `${hi} A quick reminder that ${rs(bal)} is still due for your ${j.car} (${svc(j)}). Thank you.`;
}
function jobSheet(id){
  const j = S.jobs.find(x => x.id === id); if(!j) return null;
  const bal = balance(j), w = warrantyTo(j), lead = S.leads.find(l => l.job === j.id);
  const idx = JOB_ST.indexOf(j.status);
  const msgs = j.phone ? [
    j.status === "Booked" ? ["booked", "Booking confirmation"] : null,
    j.status === "QC" ? ["ready", "Car is ready"] : null,
    j.status === "Delivered" ? ["thanks", w ? "Thank you + warranty" : "Thank you"] : null,
    bal && j.status !== "Booked" ? ["pay", "Payment reminder"] : null,
    +j.paid ? ["receipt", "Payment receipt"] : null].filter(Boolean) : [];
  const rows = [
    ["Customer", esc(j.customer || "Not given")],
    ["Phone", j.phone ? `<a href="${telLink(j.phone)}">${esc(j.phone)}</a>` : '<span class="sub">Not given</span>'],
    ["Number plate", esc(j.plate || "") || '<span class="sub">Not given</span>'],
    ["Car size", esc(CLASSES[j.cls] ? CLASSES[j.cls][0] : "")],
    ["Work", esc(svc(j))],
    ["Film", esc(j.film || "None")],
    ["Products", jobLine(j) || '<span class="sub">None logged</span>'],
    ["Source", esc(j.source || "") + (lead ? ` <button class="mini" type="button" data-open="lead:${esc(lead.id)}" style="margin-left:6px">Open lead</button>` : "")],
    ["Date in", esc(longDate(j.dateIn))],
    ["Ready by", j.dueDate ? esc(longDate(j.dueDate)) : '<span class="sub">Not set</span>'],
    ["Delivered", j.dateOut ? esc(longDate(j.dateOut)) : '<span class="sub">Not yet</span>'],
    ["Assigned to", esc(j.assigned || "") || '<span class="sub">Nobody yet</span>'],
    ["Warranty", w ? `${esc(j.warrantyYears)} years, to ${esc(longDate(w))}` : (+j.warrantyYears ? `${esc(j.warrantyYears)} years from delivery` : '<span class="sub">None recorded</span>')],
    ["Notes", j.notes ? esc(j.notes) : '<span class="sub">None</span>']];
  const pays = Array.isArray(j.payments) ? j.payments : [];
  return `
    <div class="shh"><div><div class="meta"><span class="pill ${cls(j.status)}">${esc(j.status)}</span>${bal && j.status !== "Booked" ? `<span class="pill st-Due">${rs(bal)} due</span>` : (+j.price && !bal ? '<span class="pill st-Paid">Paid</span>' : "")}</div>
      <h2 tabindex="-1" autofocus>${esc(j.car)}</h2><p>${esc([j.plate, j.customer].filter(Boolean).join(" · ") || svc(j))}</p></div>${closeBtn()}</div>
    <div class="steps" role="group" aria-label="Status">${JOB_ST.map((s, i) => `<button type="button" class="${i < idx ? "done" : i === idx ? "cur" : ""}" data-act="job-step" data-id="${esc(j.id)}" data-v="${s}" ${dis()} aria-pressed="${i === idx}">${s}</button>`).join("")}</div>
    <div class="acts">
      ${j.phone ? `<a class="btn wa" href="${waLink(j.phone, "Hi" + (first(j.customer) ? " " + first(j.customer) : "") + ", this is Detail Dungeon.")}" target="_blank" rel="noopener">${icon("chat")}WhatsApp</a><a class="btn" href="${telLink(j.phone)}">${icon("phone")}Call</a>` : `<span class="sub">Add a phone number to message or call the customer.</span>`}
    </div>
    ${msgs.length ? `<div class="lab" style="margin-bottom:8px">Send on WhatsApp</div><div class="acts">${msgs.map(m => `<a class="mini" href="${waLink(j.phone, msgFor(j, m[0]))}" target="_blank" rel="noopener">${icon("chat")}${m[1]}</a>`).join("")}</div>` : ""}
    <div class="money"><div><span class="lab">Price</span><b>${rs(j.price || 0)}</b></div><div><span class="lab">Paid</span><b>${rs(Math.min(+j.paid || 0, +j.price || 0))}</b></div><div class="${bal ? "due" : ""}"><span class="lab">Balance</span><b>${rs(bal)}</b></div></div>
    ${pays.length ? `<div class="hist">${pays.map(p => `<div><span>${esc(shortDate(p.date))} · ${esc(p.method || "")}</span><span class="num">${rs(p.amount)}</span></div>`).join("")}</div>` : ""}

        job.dateOut = status === "Delivered" ? todayISO() : ""; job.created = new Date().toISOString();
        const ref = await S.db.collection("jobs").add(job);
        if(form.dataset.lead){ await S.db.doc("leads/" + form.dataset.lead).update({ status: "Booked", job: ref.id }); }
        done("Job saved: " + car);
      }
    } else if(kind === "lead"){
      const car = String(fd.get("car") || "").trim(); if(!car){ btn.disabled = false; return invalid(form.elements.car, "Add the car, even roughly"); }
      const lead = { source: fd.get("source"), car, name: String(fd.get("name") || "").trim(),
        phone: String(fd.get("phone") || "").replace(/[^\d+ ]/g, "").trim(), want: String(fd.get("want") || "").trim(), followUp: fd.get("followUp") || "" };
      if(edit){ await S.db.doc("leads/" + edit).update(lead); done("Lead updated"); }
      else { Object.assign(lead, { status: "New", ts: new Date().toISOString(), job: "", notes: "" }); await S.db.collection("leads").add(lead); done("Lead saved"); }
    } else if(kind === "pay"){
      const j = S.jobs.find(x => x.id === form.dataset.id); if(!j){ dlg.close(); return; }
      const amount = Math.max(0, +fd.get("amount") || 0); if(!amount){ btn.disabled = false; return invalid(form.elements.amount, "Enter the amount received"); }
      const payments = (Array.isArray(j.payments) ? j.payments : []).concat([{ amount, method: fd.get("method"), date: fd.get("date") || todayISO() }]);
      await S.db.doc("jobs/" + j.id).update({ paid: (+j.paid || 0) + amount, payMethod: fd.get("method"), payments });
      done(rs(amount) + " recorded");
    } else if(kind === "receive"){
      const s = stockBy(fd.get("item")); if(!s){ btn.disabled = false; return invalid(form.elements.item, "Pick the item that arrived"); }
      const qty = Math.max(0, +fd.get("qty") || 0); if(!qty){ btn.disabled = false; return invalid(form.elements.qty, "Enter how much arrived"); }
      const log = (Array.isArray(s.log) ? s.log : []).concat([{ qty, date: todayISO(), note: String(fd.get("note") || "").trim() }]).slice(-50);
      await S.db.doc("stock/" + s.id).update({ received: (+s.received || 0) + qty, log });
      done(fmt1(qty) + " " + s.unit + " added to " + s.name);
    } else if(kind === "item"){
      const name = String(fd.get("name") || "").trim(); if(!name){ btn.disabled = false; return invalid(form.elements.name, "Name the item"); }
      const item = { name, kind: fd.get("kind"), unit: fd.get("unit"), opening: Math.max(0, +fd.get("opening") || 0), reorder: Math.max(0, +fd.get("reorder") || 0), note: String(fd.get("note") || "").trim() };
      if(edit){ await S.db.doc("stock/" + edit).update(item); done("Saved: " + name); }
      else { item.received = 0; await S.db.collection("stock").add(item); done("Added: " + name); }
    }
  } catch(err){ btn.disabled = false; writeFailed(err); }
});

/* ---- actions ------------------------------------------------------------- */
/* open dialogs sit in the browser's top layer, so the toast travels into whichever one is on top */
function raiseToast(){ const el = $("#toast"), top = [...document.querySelectorAll("dialog[open]")].pop() || document.body; if(el.parentNode !== top) top.appendChild(el); }
function modal(d){ if(!d.open) d.showModal(); raiseToast(); }
document.querySelectorAll("dialog").forEach(d => d.addEventListener("close", () => setTimeout(raiseToast, 0)));
function toast(t, undo){
  const el = $("#toast"), u = $("#toastUndo"); $("#toastText").textContent = t; raiseToast();
  u.hidden = !undo; toast.undo = undo || null;
  el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => { el.classList.remove("on"); toast.undo = null; }, undo ? 6000 : 2400);
}
$("#toastUndo").addEventListener("click", async () => { const f = toast.undo; toast.undo = null; $("#toast").classList.remove("on"); if(f){ try{ await f(); toast("Undone"); } catch(err){ writeFailed(err); } } });
function writeFailed(err){
  if(err && (err.code === "invalid_argument" || err.code === "permission_denied" || err.code === "not_granted")){ S.canWrite = false; render(); toast("You can view the desk but not change it"); }
  else if(err && err.code === "quota_exceeded") toast("The desk is full. Delete old jobs to add more.");
  else toast("Couldn't save. Check the connection and try again.");
}
async function setJobStatus(id, status){
  const j = S.jobs.find(x => x.id === id); if(!j || j.status === status) return;
  const before = { status: j.status, dateOut: j.dateOut || "" };
  try{
    await S.db.doc("jobs/" + id).update({ status, dateOut: status === "Delivered" ? (j.dateOut || todayISO()) : "" });
    toast(j.car + ": " + status, () => S.db.doc("jobs/" + id).update(before));
  } catch(err){ writeFailed(err); render(); }
}
async function setLead(id, patch, msg){
  try{ await S.db.doc("leads/" + id).update(patch); if(msg) toast(msg); } catch(err){ writeFailed(err); render(); }
}
async function delDoc(coll, id, label, extra){
  const doc = S[coll].find(x => x.id === id); if(!doc) return;
  const data = Object.assign({}, doc); delete data.id;
  confirmBox("Delete " + label + "?", "This removes it for everyone. You can undo for a few seconds.", "Delete", async () => {
    try{
      await S.db.doc(coll + "/" + id).delete();
      if(extra) await extra.after();
      closeSheet(); if(dlg.open) dlg.close();
      toast(label.charAt(0).toUpperCase() + label.slice(1) + " deleted", async () => { await S.db.doc(coll + "/" + id).set(data); if(extra && extra.undo) await extra.undo(); });
    } catch(err){ writeFailed(err); }
  });
}
function csv(rows){ return rows.map(r => r.map(v => { const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\n"); }
async function saveFile(name, text){
  const blob = new Blob(["﻿" + text], { type: "text/csv;charset=utf-8" });
  try{ const c = window.claude, dl = c && c.use ? await c.use("downloads") : null; if(dl){ await dl.save({ filename: name, data: blob }); return; } }
  catch(err){ if(err && err.code === "declined") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("Saved " + name);
}
function exportJobs(){
  const rows = [["Date in","Ready by","Delivered","Car","Plate","Size","Customer","Phone","Service","Coverage","Film","Price","Paid","Balance","Status","Source","Assigned to","Warranty to","Notes"]]
    .concat(S.jobs.slice().sort((a, b) => cmp((b.dateIn || ""), a.dateIn || "")).map(j => [j.dateIn, j.dueDate, j.dateOut, j.car, j.plate, CLASSES[j.cls] ? CLASSES[j.cls][0] : "", j.customer, j.phone, j.service, j.coverage, j.film, +j.price || 0, Math.min(+j.paid || 0, +j.price || 0), balance(j), j.status, j.source, j.assigned, warrantyTo(j), j.notes]));
  saveFile("detail-dungeon-jobs-" + todayISO() + ".csv", csv(rows));
}
function exportLeads(){
  const rows = [["Received","Source","Car","Name","Phone","What they want","Status","Follow up","Notes"]]
    .concat(S.leads.slice().sort((a, b) => tsv(b) - tsv(a)).map(l => [l.ts ? l.ts.slice(0, 16).replace("T", " ") : "", l.source, l.car, l.name, l.phone, l.want, l.status, l.followUp, l.notes]));
  saveFile("detail-dungeon-leads-" + todayISO() + ".csv", csv(rows));
}
function daySummary(){
  const t = todayISO(), inBay = S.jobs.filter(j => j.status === "In bay" || j.status === "QC"), arriving = S.jobs.filter(j => j.status === "Booked" && j.dateIn <= t);
  const out = S.jobs.filter(j => j.dateOut === t), newLeads = S.leads.filter(l => dayOf(l.ts) === t), due = S.jobs.filter(j => j.status !== "Booked" && balance(j) > 0);
  const paidToday = S.jobs.reduce((a, j) => a + (Array.isArray(j.payments) ? j.payments.filter(p => p.date === t).reduce((b, p) => b + (+p.amount || 0), 0) : 0), 0);
  return [`Detail Dungeon, ${longDate(t)}`, "",
    `In the bay: ${inBay.length}${inBay.length ? " (" + inBay.map(j => j.car + ", " + j.status).join("; ") + ")" : ""}`,
    `Arriving today: ${arriving.length}${arriving.length ? " (" + arriving.map(j => j.car).join(", ") + ")" : ""}`,
    `Delivered today: ${out.length}${out.length ? " (" + out.map(j => j.car).join(", ") + ")" : ""}`,
    `New leads today: ${newLeads.length}, ${S.leads.filter(l => l.status === "New").length} waiting for a reply`,
    `Collected today: ${rs(paidToday)}`,
    `Still to collect: ${rs(due.reduce((a, j) => a + balance(j), 0))} on ${due.length} ${due.length === 1 ? "car" : "cars"}`].join("\n");
}
function openFromKey(k){
  const i = k.indexOf(":"), kind = k.slice(0, i), id = k.slice(i + 1);
  if(kind === "job" || kind === "lead" || kind === "cust") openSheet(kind, id);
  else if(kind === "stock"){ go("stock"); setTimeout(() => { const el = document.getElementById("stk-" + id); if(el) el.scrollIntoView({ block: "center" }); }, 50); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if(!b){
    const t = e.target.closest("[data-tab]"); if(t){ go(t.dataset.tab); menu(false); return; }
    const o = e.target.closest("[data-open]");
    if(o && !e.target.closest("select,a,input,textarea,label")){ if($("#drawer").classList.contains("on")) menu(false); openFromKey(o.dataset.open); }
    return;
  }
  const a = b.dataset.act, id = b.dataset.id;
  if(b.disabled) return;
  if(a === "menu") menu(!$("#drawer").classList.contains("on"));
  else if(a === "menu-close") menu(false);
  else if(a === "new-job"){ menu(false); openJob(); }
  else if(a === "new-lead"){ menu(false); openLead(); }
  else if(a === "receive"){ menu(false); openReceive(id); }
  else if(a === "new-item") openItem();
  else if(a === "edit-item") openItem(id);
  else if(a === "item-del"){ const s = stockBy(id); if(s) delDoc("stock", id, s.name); }
  else if(a === "search"){ menu(false); stack = []; S.lastQ = ""; S.sheet = { kind: "search" }; sheetBody.innerHTML = searchSheet(); searchResults(); modal(sheet); setTimeout(() => $("#gq") && $("#gq").focus(), 40); }
  else if(a === "share-day"){ menu(false); window.open("https://wa.me/?text=" + encodeURIComponent(daySummary()), "_blank", "noopener"); }
  else if(a === "export-jobs"){ menu(false); exportJobs(); }
  else if(a === "export-leads"){ menu(false); exportLeads(); }
  else if(a === "goto-due"){ menu(false); S.jf = "Due"; go("jobs"); }
  else if(a === "close") dlg.close();
  else if(a === "sheet-close") closeSheet();
  else if(a === "sheet-back"){ const prev = stack.pop(); if(prev){ if(prev.kind === "search"){ S.sheet = prev; sheetBody.innerHTML = searchSheet(); const g = $("#gq"); if(g){ g.value = S.lastQ || ""; } searchResults(); } else openSheet(prev.kind, prev.id, { back: true }); } }
  else if(a === "confirm-no") confirmDlg.close();
  else if(a === "confirm-yes"){ confirmDlg.close(); const f = confirmBox.cb; confirmBox.cb = null; if(f) f(); }
  else if(a === "period"){ S.period = b.dataset.v; render(); }
  else if(a === "jf"){ S.jf = b.dataset.v; S.jlim = 100; render(); }
  else if(a === "lf"){ S.lf = b.dataset.v; S.llim = 100; render(); }
  else if(a === "more"){ S[b.dataset.v] += b.dataset.v === "clim" ? 60 : 100; render(); }
  else if(a === "advance"){ const j = S.jobs.find(x => x.id === id); if(j && NEXT[j.status]) setJobStatus(j.id, NEXT[j.status]); }
  else if(a === "job-step") setJobStatus(id, b.dataset.v);
  else if(a === "job-edit"){ const j = S.jobs.find(x => x.id === id); if(j) openJob(j, id); }
  else if(a === "job-pay") openPayment(id);
  else if(a === "job-del"){ const j = S.jobs.find(x => x.id === id); if(!j) return; const lead = S.leads.find(l => l.job === id);
    delDoc("jobs", id, "the job for " + j.car, lead ? { after: () => S.db.doc("leads/" + lead.id).update({ job: "", status: "Contacted" }), undo: () => S.db.doc("leads/" + lead.id).update({ job: id, status: lead.status }) } : null); }
  else if(a === "lead-step"){ const l = S.leads.find(x => x.id === id); if(l && l.status !== b.dataset.v) setLead(id, { status: b.dataset.v }, "Lead: " + b.dataset.v); }
  else if(a === "lead-save"){ const fu = $("#l-fu"), nt = $("#l-notes"); setLead(id, { followUp: fu ? fu.value : "", notes: nt ? nt.value.trim() : "" }, "Notes saved").then(() => sheetBody.querySelectorAll("[data-keep]").forEach(el => delete el.dataset.dirty)); }
  else if(a === "lead-edit"){ const l = S.leads.find(x => x.id === id); if(l) openLead(l, id); }
  else if(a === "lead-del"){ const l = S.leads.find(x => x.id === id); if(l) delDoc("leads", id, "this lead"); }
  else if(a === "lead-job"){ const l = S.leads.find(x => x.id === id); if(l) openJob({ car: l.car, customer: l.name, phone: l.phone, source: SOURCES.includes(l.source) ? l.source : "Walk-in", leadId: l.id, notes: l.want }); }
  else if(a === "add-line"){ $("#plines").insertAdjacentHTML("beforeend", pline(null)); }
  else if(a === "rm-line"){ const lines = form.querySelectorAll(".pline"); if(lines.length > 1) b.closest(".pline").remove(); else { b.closest(".pline").querySelector("select").value = ""; b.closest(".pline").querySelector("input").value = ""; } }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if(t.dataset.act === "jst") setJobStatus(t.dataset.id, t.value);
  else if(t.dataset.act === "lst"){ const l = S.leads.find(x => x.id === t.dataset.id); if(l) setLead(l.id, { status: t.value }, "Lead: " + t.value); }
  else if(t.id === "jsvc"){ S.jsvc = t.value; S.jlim = 100; render(); }
  else if(t.id === "l-fu" && S.sheet && S.sheet.kind === "lead"){ delete t.dataset.dirty; setLead(S.sheet.id, { followUp: t.value }, t.value ? "Follow-up set for " + shortDate(t.value) : "Follow-up cleared"); }
});
let qTimer = 0;
document.addEventListener("input", e => {
  const id = e.target.id;
  if(id === "jq" || id === "lq" || id === "cq"){ S[id] = e.target.value; S.jlim = S.llim = 100; S.clim = 60; clearTimeout(qTimer); qTimer = setTimeout(render, 150); }
  else if(id === "gq"){ S.lastQ = e.target.value; searchResults(); }
  else if(e.target.dataset && "keep" in e.target.dataset) e.target.dataset.dirty = "1";
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && $("#drawer").classList.contains("on")) menu(false);
  if(e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "") && !dlg.open && !sheet.open){ e.preventDefault(); document.querySelector('[data-act="search"]').click(); }
  if((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-open]") && !e.target.matches("button")){ e.preventDefault(); openFromKey(e.target.dataset.open); }
});
function go(tab){ if(!TABS[tab]) tab = "overview"; S.tab = tab; try{ history.replaceState(null, "", "#" + tab); } catch(_){} render(); window.scrollTo({top: 0}); }

/* ---- data ---------------------------------------------------------------- */
const h = (location.hash || "").slice(1); if(TABS[h]) S.tab = h;
render();
(async function(){
  const c = window.claude;
  const [db, user] = await Promise.all([c && c.use ? c.use("db") : null, c && c.use ? c.use("user") : null]);
  S.dbChecked = true; S.db = db;
  if(user && user.can){ try{ const w = await user.can("data.write"); if(w === false) S.canWrite = false; } catch(_){} }
  if(!db){ render(); return; }
  const sub = name => db.collection(name).onSnapshot(snap => {
    S[name] = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); S.got[name] = true; render();
  }, () => { S.got[name] = true; render(); });
  sub("jobs"); sub("leads"); sub("stock");
  render();
})();
})();
</script>
</body></html>
